{% if user.is_authenticated %}
    <button hx-post="{% url 'marketplace:toggle_save' listing.id %}"
            hx-target="this"
            hx-swap="outerHTML"
            title="{% if is_saved %}Remove from Wishlist{% else %}Save to Wishlist{% endif %}"
            class="px-2.5 py-1.5 rounded-xl border transition-all duration-200 flex items-center gap-1.5 text-xs font-semibold shadow-sm {% if is_saved %}bg-rose-50 dark:bg-rose-950/50 border-rose-200 dark:border-rose-900 text-rose-600 dark:text-rose-400{% else %}bg-white/95 dark:bg-slate-900/95 border-slate-200 dark:border-slate-800 text-slate-500 hover:text-rose-500 hover:border-rose-200{% endif %}">
        {% if is_saved %}
            <svg class="w-4 h-4 fill-current text-rose-600 dark:text-rose-400" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"></path>
            </svg>
        {% else %}
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
            </svg>
        {% endif %}
        <span>{% if favorites_count is not None %}{{ favorites_count }}{% else %}{{ listing.favorites_count }}{% endif %}</span>
    </button>
{% else %}
    <a href="{% url 'accounts:login' %}?next={% url 'marketplace:listing_detail' listing.id %}"
       title="Log in to save this item"
       class="px-2.5 py-1.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white/95 dark:bg-slate-900/95 text-slate-400 hover:text-rose-500 transition text-xs font-semibold shadow-sm flex items-center gap-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
        </svg>
        <span>{{ listing.favorites_count }}</span>
    </a>
{% endif %}
