{% if listing.is_sold %}
    <div id="status-container-{{ listing.pk }}" class="flex items-center gap-2">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-slate-900 text-white shadow-sm">
            <span class="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse"></span>
            SOLD
        </span>
        {% if is_owner %}
            <button hx-post="{% url 'marketplace:listing_toggle_sold' listing.pk %}"
                    hx-target="#status-container-{{ listing.pk }}"
                    hx-swap="outerHTML"
                    class="px-3 py-1 text-xs font-semibold rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 transition shadow-sm flex items-center gap-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                <span>Re-list Available</span>
            </button>
        {% endif %}
    </div>
{% else %}
    <div id="status-container-{{ listing.pk }}" class="flex items-center gap-2">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 border border-emerald-300/60 dark:border-emerald-800">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
            AVAILABLE
        </span>
        {% if is_owner %}
            <button hx-post="{% url 'marketplace:listing_toggle_sold' listing.pk %}"
                    hx-target="#status-container-{{ listing.pk }}"
                    hx-swap="outerHTML"
                    class="px-3 py-1 text-xs font-semibold rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 transition shadow-sm flex items-center gap-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
                <span>Mark as Sold</span>
            </button>
        {% endif %}
    </div>
{% endif %}
