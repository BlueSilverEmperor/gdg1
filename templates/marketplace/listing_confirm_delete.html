{% extends 'base.html' %}

{% block title %}Confirm Delete - {{ listing.title }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12">
    <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-xl border border-rose-100 dark:border-rose-950/60 p-8 text-center space-y-6">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-rose-50 dark:bg-rose-950/50 text-rose-600 flex items-center justify-center">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
            </svg>
        </div>

        <div>
            <h1 class="font-display font-extrabold text-2xl text-slate-900 dark:text-white">Delete Listing?</h1>
            <p class="text-sm text-slate-500 mt-2">
                Are you sure you want to permanently delete <strong class="text-slate-800 dark:text-slate-200">"{{ listing.title }}"</strong>? This action cannot be undone.
            </p>
        </div>

        <form method="post" class="space-y-3">
            {% csrf_token %}
            <button type="submit" class="w-full py-3 px-4 rounded-xl bg-rose-600 hover:bg-rose-700 active:scale-95 text-white font-bold text-sm shadow-md shadow-rose-600/25 transition">
                Yes, Delete Listing
            </button>
            <a href="{% url 'marketplace:listing_detail' listing.pk %}" class="block w-full py-2.5 px-4 rounded-xl border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-300 font-semibold text-sm hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
